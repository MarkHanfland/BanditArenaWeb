name: Playwright E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-pr.yml'

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BanditArenaWeb
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Cloud happy-path / console specs use VITE_E2E_AUTH_BYPASS — no private
      # BanditArena credentials checkout required (sibling repo is often inaccessible
      # to GITHUB_TOKEN). Fixture usernames satisfy the bypass login form.
      - name: Run Playwright tests
        env:
          BANDIT_TEST_CREDENTIALS_PATH: ${{ github.workspace }}/tests/fixtures/e2e-bypass-credentials.json
          VITE_E2E_AUTH_BYPASS: 'true'
        run: npm run test:e2e
