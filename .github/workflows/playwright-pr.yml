name: Playwright E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright-pr.yml'

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BanditArenaWeb
        uses: actions/checkout@v4

      - name: Checkout BanditArena
        uses: actions/checkout@v4
        with:
          repository: MarkHanfland/BanditArena
          path: BanditArena
          fetch-depth: 1

      - name: Materialize test credentials
        working-directory: BanditArena
        env:
          BANDIT_COGNITO_TEST_PASSWORD: ${{ secrets.BANDIT_COGNITO_TEST_PASSWORD }}
        run: |
          pwsh ./scripts/test/Materialize-TestCredentials.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BANDIT_TEST_CREDENTIALS_PATH: ${{ github.workspace }}/BanditArena/credentials/test-credentials.json
        run: npm run test:e2e
