name: Deploy Bandit Arena Console

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/workflows/pr-validate.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '20'
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::598442446265:role/bandit-arena-website-deploy-prod
  STACK_NAME: bandit-arena-website-prod

jobs:
  # A push to main does not reach the bucket if the console fails the accessibility gate (SW-163).
  accessibility-gate:
    runs-on: ubuntu-24.04 # Playwright does not support the newer ubuntu-latest image yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Console accessibility gate
        env:
          BANDIT_TEST_CREDENTIALS_PATH: ${{ github.workspace }}/tests/fixtures/e2e-bypass-credentials.json
          VITE_E2E_AUTH_BYPASS: 'true'
        run: npx playwright test tests/e2e/accessibility.spec.ts

  build-and-deploy:
    needs: accessibility-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$VITE_MAPBOX_ACCESS_TOKEN" ]; then
            echo "GitHub secret VITE_MAPBOX_ACCESS_TOKEN is required for the Mapbox maps."
            exit 1
          fi
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve stack outputs
        id: stack
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" --query "Stacks[0].Outputs[?OutputKey=='WebsiteBucketName'].OutputValue" --output text)
          DIST=$(aws cloudformation describe-stacks --stack-name "${{ env.STACK_NAME }}" --query "Stacks[0].Outputs[?OutputKey=='ConsoleDistributionId'].OutputValue" --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        run: aws s3 sync ./dist "s3://${{ steps.stack.outputs.bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution }}" \
            --paths "/*"
